<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMessage Twitch Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="chat-container"></div>

    <script>
        // --- CONFIGURATION ---
        const channelName = 'mcdemil'; 
        const baseUrl = 'https://emmyfox.github.io/Forest-Chat/'; 

        const channelEmotes = new Map();

        // Optional: Try loading 7TV emotes as well
        async function loadChannelEmotes() {
            try {
                const response = await fetch(`https://7tv.io/v3/users/twitch/${channelName}`);
                const data = await response.json();
                if (data && data.emote_set && data.emote_set.emotes) {
                    data.emote_set.emotes.forEach(emote => {
                        channelEmotes.set(emote.name, `https://cdn.7tv.app/emote/${emote.id}/2x.webp`);
                    });
                }
            } catch (err) {
                console.log('7TV lookup skipped.');
            }
        }

        const animalAssets = {
            'bear': { file: 'bear.png', color: '#fff3cc' },
            'cat': { file: 'cat.png', color: '#d1eaff' },
            'dog': { file: 'dog.png', color: '#f2e6ff' },
            'turtle': { file: 'turtle.png', color: '#ffe6f2' },
            'deer': { file: 'deer.png', color: '#e0f5e0' },
            'duck': { file: 'duck.png', color: '#fff3cc' },
            'squirrel': { file: 'squirrel.png', color: '#d1eaff' },
            'mouse': { file: 'mouse.png', color: '#f2e6ff' }
        };

        const animalKeys = Object.keys(animalAssets);
        const userAssetMap = new Map();

        function connectTwitchChat() {
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                ws.send('NICK justinfan12345');
                ws.send('JOIN #' + channelName);
            };

            ws.onmessage = (event) => {
                const messageData = event.data;
                
                if (messageData.startsWith('PING')) {
                    ws.send('PONG ' + messageData.split(' ')[1]);
                    return;
                }

                if (messageData.includes('PRIVMSG')) {
                    try {
                        const parts = messageData.split(' ');
                        const tagsPart = parts[0];
                        
                        const userMatch = tagsPart.match(/display-name=([^;]*)/);
                        const nameMatch = tagsPart.match(/user-name=([^;]*)/);
                        const emotesMatch = tagsPart.match(/emotes=([^;]*)/);
                        
                        let displayName = userMatch && userMatch[1] ? userMatch[1] : '';
                        let username = nameMatch && nameMatch[1] ? nameMatch[1].toLowerCase() : '';
                        if (!username && displayName) username = displayName.toLowerCase();

                        const chatMessageIndex = messageData.indexOf('PRIVMSG #' + channelName + ' :');
                        if (chatMessageIndex === -1) return;
                        let rawMessage = messageData.substring(chatMessageIndex + ('PRIVMSG #' + channelName + ' :').length).trim();

                        let emotesTag = emotesMatch ? emotesMatch[1] : '';

                        appendChatMessage(username, displayName || username, rawMessage, emotesTag);
                    } catch (err) {
                        console.error('Error parsing message:', err);
                    }
                }
            };

            ws.onclose = () => {
                setTimeout(connectTwitchChat, 5000);
            };
        }

        // Advanced parser handling both Twitch metadata tags AND word-list fallbacks
        function parseMessageContent(message, emotesTag) {
            let charArray = Array.from(message);
            let replacedRanges = [];

            // 1. Parse official Twitch/Affiliate emote tags if present
            if (emotesTag) {
                emotesTag.split('/').forEach(emoteGroup => {
                    if (!emoteGroup) return;
                    let [emoteId, positions] = emoteGroup.split(':');
                    if (!positions) return;

                    positions.split(',').forEach(pos => {
                        let [start, end] = pos.split('-').map(Number);
                        replacedRanges.push({ start, end, html: `<img class="twitch-emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/2.0" />` });
                    });
                });
            }

            // Sort from back to front so splicing indices don't shift
            replacedRanges.sort((a, b) => b.start - a.start);

            replacedRanges.forEach(range => {
                charArray.splice(range.start, (range.end - range.start) + 1, range.html);
            });

            // Rebuild string, processing any words left over (like 7TV emotes)
            return charArray.map(item => {
                if (item.startsWith('<img')) return item; // Already an emote image
                
                // Check word-by-word for 7TV or custom map emotes
                const words = item.split(' ');
                return words.map(word => {
                    if (channelEmotes.has(word)) {
                        return `<img class="twitch-emote" src="${channelEmotes.get(word)}" alt="${word}" />`;
                    }
                    return escapeHtml(word);
                }).join(' ');
            }).join('');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function appendChatMessage(username, displayName, message, emotesTag) {
            const chatContainer = document.getElementById('chat-container');
            let assignedAsset;

            if (username === 'mcdemil') {
                assignedAsset = { file: 'mcdemil.png', color: '#ffe6f2' };
            } else if (username === 'binxycat_' || username === 'binxycat') {
                assignedAsset = { file: 'binxycat_.png', color: '#f2e6ff' };
            } else if (userAssetMap.has(username)) {
                assignedAsset = userAssetMap.get(username);
            } else {
                const randomKey = animalKeys[Math.floor(Math.random() * animalKeys.length)];
                assignedAsset = animalAssets[randomKey];
                userAssetMap.set(username, assignedAsset);
            }

            const avatarUrl = baseUrl + assignedAsset.file;
            const bubbleColor = assignedAsset.color;

            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('chat-message');

            const avatarElement = document.createElement('img');
            avatarElement.classList.add('avatar');
            avatarElement.src = avatarUrl;
            avatarElement.alt = username;

            const bubbleElement = document.createElement('div');
            bubbleElement.classList.add('message-bubble');
            bubbleElement.style.backgroundColor = bubbleColor;
            
            const styleId = `tail-${bubbleColor.replace('#', '')}`;
            if (!document.getElementById(styleId)) {
                const styleSheet = document.createElement("style");
                styleSheet.id = styleId;
                document.head.appendChild(styleSheet);
                styleSheet.innerHTML = `
                    .chat-message .message-bubble[style*="${bubbleColor}"]::before { 
                        background-color: ${bubbleColor}; 
                    }
                `;
            }

            // Render parsed emotes
            bubbleElement.innerHTML = parseMessageContent(message, emotesTag);

            messageWrapper.appendChild(avatarElement);
            messageWrapper.appendChild(bubbleElement);
            
            chatContainer.appendChild(messageWrapper);

            // 5-minute fade-out timer (300,000 ms)
            setTimeout(() => {
                messageWrapper.classList.add('fade-out');
                setTimeout(() => {
                    if (messageWrapper.parentNode) {
                        messageWrapper.parentNode.removeChild(messageWrapper);
                    }
                }, 500); 
            }, 300000);

            if (chatContainer.children.length > 25) {
                chatContainer.removeChild(chatContainer.firstChild);
            }
        }

        loadChannelEmotes().then(() => {
            connectTwitchChat();
        });
    </script>
</body>
</html>
