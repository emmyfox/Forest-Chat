<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cozy Pastel Chat</title>
    <style>
        body {
            background-color: rgba(0, 0, 0, 0);
            margin: 0px;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #chat-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 380px;
            pointer-events: none;
        }

        .chat-message {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, transform 0.3s ease;
            width: 100%;
        }

        .chat-message.fade-out {
            opacity: 0;
            transform: translateY(-8px);
        }

        .chat-message.left {
            flex-direction: row;
            justify-content: flex-start;
        }

        .chat-message.right {
            flex-direction: row-reverse;
            justify-content: flex-start;
        }

        .avatar {
            width: 45px;
            height: 45px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        .bubble {
            max-width: 290px;
            padding: 8px 12px;
            border-radius: 14px;
            word-break: break-word;
            overflow-wrap: break-word;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
            line-height: 1.3;
        }

        .username-header {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 2px;
            color: #1f1929;
        }

        .username-icon {
            font-size: 14px;
        }

        .message-text {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .message-text img.twitch-emote {
            height: 22px;
            vertical-align: middle;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.js"></script>
    <script src="script.js"></script>
</body>
</html>
