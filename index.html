<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cozy Pastel Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: rgba(0, 0, 0, 0);
            margin: 0px;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        #chat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .chat-message {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .chat-message.fade-out {
            animation: fadeOut 0.5s ease forwards;
        }

        .chat-message.left {
            flex-direction: row;
        }

        .chat-message.right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 45px;
            height: 45px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .message-content-wrap {
            display: flex;
            flex-direction: column;
            max-width: 330px;
        }

        .right .message-content-wrap {
            align-items: flex-end;
        }

        .namebox {
            width: fit-content;
            font-size: 18px;
            font-weight: 700;
            color: #573e96;
            background: #ddd2ff;
            padding: 4px 14px;
            border-radius: 15px;
            border: 2px solid #af95ef;
            margin-bottom: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .messagebox {
            width: 100%;
            font-size: 18px;
            color: #573e96;
            font-weight: 700;
            background: #ddd2ff;
            padding: 12px 18px;
            border-radius: 18px;
            border: 2px solid #af95ef;
            word-break: break-word;
            overflow-wrap: break-word;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            line-height: 1.4;
        }

        /* Emote styling for static & animated Twitch / BTTV / 7TV emotes */
        .messagebox img.emote {
            height: 28px;
            vertical-align: middle;
            display: inline-block;
            margin: 0 3px;
        }

        .messagebox img.large-emote {
            height: 48px;
            vertical-align: middle;
            display: inline-block;
            margin: 0 4px;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <!-- ComfyJS library to listen to Twitch chat -->
    <script src="https://cdn.jsdelivr.net/npm/@tmijs/tmi.js@1.8.5/lib/tmi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.js"></script>
    <script src="script.js"></script>
</body>
</html>
